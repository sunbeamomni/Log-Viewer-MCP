# 每次推送到 main：跑单元与属性测试 → 计算新版本号 → 构建 amd64/arm64 镜像推送到 ghcr.io → 打 tag 并发布 Release。
#
# 版本号：取最新的 vX.Y.Z tag，补丁号加 1；还没有 tag 时用 pyproject.toml 的 version。
# 要升主版本或次版本，把 pyproject.toml 的 version 改大（如 0.2.0），比"最新 tag 加 1"大时以它为准。
# 同一个提交重新运行时沿用该提交已有的 tag，不会重复发版。
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# 串行执行，避免两次推送算出同一个版本号
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -e ".[server,test]"
      - name: 单元与属性测试
        run: python -m pytest tests/unit tests/property -q

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 tag 与 Release
      packages: write   # 推送到 ghcr.io
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 需要全部 tag 来计算版本号

      - name: 计算版本号
        id: version
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import re, subprocess, tomllib

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True, check=True).stdout.split()

          def parse(text):
              return tuple(int(x) for x in text.split("."))

          semver = re.compile(r"v[0-9]+\.[0-9]+\.[0-9]+")
          here = sorted((parse(t[1:]) for t in git("tag", "--points-at", "HEAD") if semver.fullmatch(t)), reverse=True)
          if here:
              version = here[0]
          else:
              base = parse(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
              tags = [parse(t[1:]) for t in git("tag", "--list", "v*") if semver.fullmatch(t)]
              if tags:
                  latest = max(tags)
                  version = max((latest[0], latest[1], latest[2] + 1), base)
              else:
                  version = base
          text = "%d.%d.%d" % version
          print(f"version={text}")
          print(f"tag=v{text}")
          EOF
          cat "$GITHUB_OUTPUT"

      - name: 镜像名（ghcr.io 要求小写）
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/log-viewer-mcp" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.title=log-viewer-mcp
            org.opencontainers.image.description=线上游戏服 SFS2X 日志查询 MCP 的跳板机服务

      - name: 构建并推送 amd64/arm64 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 创建 tag 与 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过"
            exit 0
          fi
          notes=$(printf '跳板机镜像（linux/amd64、linux/arm64）：\n\n```bash\ndocker pull %s:%s\n```\n\n部署与升级见 [deploy/README.md](https://github.com/%s/blob/%s/deploy/README.md)。\n' \
            "$IMAGE" "$VERSION" "$GITHUB_REPOSITORY" "$TAG")
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$notes" --generate-notes
